name: Trigger Vercel Deploy Hook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: vercel-deploy-hook-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger:
    name: Trigger Vercel production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing repository secret VERCEL_DEPLOY_HOOK_URL"
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 5 -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo ""
